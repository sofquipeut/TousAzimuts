<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administration — Tous Azimuts</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 30rem;
        margin: 4rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      .admin-link {
        display: block;
        padding: 1rem;
        margin-bottom: 1rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
        text-decoration: none;
        font-size: 1.1rem;
        color: inherit;
      }
      .admin-form {
        padding: 1rem;
        border: 1px solid #ccc;
        border-radius: 0.5rem;
      }
      .admin-form h2 {
        margin-top: 0;
        font-size: 1.1rem;
      }
      .admin-form input {
        width: 100%;
        box-sizing: border-box;
        font: inherit;
        padding: 0.4rem;
      }
      .admin-form button {
        font: inherit;
        padding: 0.4rem 0.8rem;
      }
      .admin-link:hover,
      .admin-link:focus {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>Administration</h1>
    <a class="admin-link" href="/admin/site/">Gérer le site</a>
    <form class="admin-form" method="get" action="https://taz-comments.hellosof.workers.dev/admin">
      <h2>Gérer les commentaires et les statistiques</h2>
      <p>
        <label for="coms_token">Mot de passe d'administration</label><br />
        <input id="coms_token" name="coms_token" type="password" autocomplete="current-password" required />
      </p>
      <button type="submit">Ouvrir la gestion des commentaires</button>
    </form>
  </body>
</html>
