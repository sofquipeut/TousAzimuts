name = "taz-comments"
main = "src/index.js"
compatibility_date = "2026-08-01"

[[d1_databases]]
binding = "DB"
database_name = "taz-comments"
database_id = "REPLACE_ME_AFTER_WRANGLER_D1_CREATE"

[vars]
ALLOWED_ORIGIN = "https://tazfm.fr"
NOTIFY_TO_EMAIL = "contact@tazfm.fr"
